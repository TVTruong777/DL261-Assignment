# Custom CNN — main comparison on Fashion-MNIST
experiment_name: "cnn_fashion_mnist"
seed: 42
deterministic: true

data:
  dataset_name: "fashion_mnist"
  root: "./data"
  val_fraction: 0.1
  split_seed: 42
  representation: "image"
  augment: false

model:
  name: "cnn"
  params:
    base_channels: 32
    dropout: 0.3

training:
  batch_size: 128
  epochs: 25
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  num_workers: 2

checkpoint:
  save_dir: "checkpoints"
  selection_metric: "accuracy"

hardware:
  device: "auto"
  gpu: "[fill in after running]"

logging:
  log_dir: "results/runs"
  experiment_log: "results/experiment_log.csv"
